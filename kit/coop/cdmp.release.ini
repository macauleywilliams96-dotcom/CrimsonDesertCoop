; Feature switches of this mod release. Installed by CoopLauncher with each update;
; values here win over cdmp.ini (edit cdmp.ini for your own settings).
[coop]
; the guest's hits on the host's enemy copies hurt the real enemy
guest_hits=1
guest_hit_stagger=1
; horse copy: not working on build 3479 yet
horse=0
; the guest's own enemies within 150 m of the host are hidden (the host's copies take
; their place); they come back when the host is 250 m away. Guest only.
suppress=1
suppress_radius_m=150
suppress_off_m=250
suppress_restore=1
; when the host's enemy dies and the guest took part, the guest's own twin of it
; dies too, in the guest's world: the guest gets its loot, skill XP and quest credit. Guest only.
guest_loot=1
